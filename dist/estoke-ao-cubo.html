/* =============================================================================
   Estoke ao Cubo — Promo vertical 9:16 (40s)
   Motor de timeline determinístico: um único relógio `t` (segundos) e cada
   elemento calcula sua posição/escala/opacidade a partir dele, com física de
   mola analítica. Resultado: animação "seekável" como um vídeo de verdade,
   sem dependências externas além do React (funciona em Claude Artifacts).
============================================================================= */

/* ---------- Marca ---------- */
const C = {
  ink: "#0B0D14",
  paper: "#F6F7FB",
  slate: "#5B6275",
  mist: "#E7EAF3",
  orange: "#FF6B2C",
  pink: "#FF3D7F",
  cobalt: "#3D5AFE",
  mint: "#1ED6A0",
  red: "#FF4D5E",
  night: "#07080D",
  violet: "#7C5CFF",
};
const FONT = `'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif`;
const GRAD = `linear-gradient(95deg, ${C.orange} 0%, ${C.pink} 48%, ${C.cobalt} 100%)`;
const W = 450;
const H = 800;
const DURATION = 40;

const SCENES = [
  { name: "Gancho", from: 0 },
  { name: "A dor", from: 4 },
  { name: "Revelação", from: 11 },
  { name: "Benefícios", from: 16 },

/* ---------- Matemática de animação ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const rnd = (i, k = 0) => {
  const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
  return s - Math.floor(s);
};

// Oscilador harmônico amortecido (0 → 1), mesma física do framer-motion.
function spring(s, { stiffness = 180, damping = 14, mass = 1 } = {}) {
  if (s <= 0) return 0;
  const w0 = Math.sqrt(stiffness / mass);
  const z = damping / (2 * Math.sqrt(stiffness * mass));
  if (z < 1) {
    const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * s) * (Math.cos(wd * s) + ((z * w0) / wd) * Math.sin(wd * s));
  }
  return 1 - Math.exp(-w0 * s) * (1 + w0 * s);
}

const parseHex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => {
  const A = parseHex(a);
  const B = parseHex(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(",")})`;
};
const hexA = (h, a) => `rgba(${parseHex(h).join(",")},${a})`;

// Cursor: posição por keyframes [t, x, y]
function path(t, keys) {
  if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const [t1, x1, y1] = keys[i];
    if (t <= t1) {
      const [t0, x0, y0] = keys[i - 1];
      const p = easeInOut((t - t0) / (t1 - t0));
      return [lerp(x0, x1, p), lerp(y0, y1, p)];
    }
  }
  const l = keys[keys.length - 1];
  return [l[1], l[2]];
}
const press = (t, tc) => {
  const d = t - tc;
  if (d < 0 || d > 0.26) return 0;
  return d < 0.08 ? d / 0.08 : 1 - (d - 0.08) / 0.18;
};
const ripple = (t, tc) => {
  const d = t - tc;
  return d < 0 || d > 0.55 ? null : d / 0.55;
};
const hold = (t, a, b) => clamp((t - a + 0.05) / 0.05) * (1 - clamp((t - b) / 0.08));

// Cursor que desenha uma caixa de seleção (estilo Figma)
function dragSel(t, { t0, from, t1, box, dur = 0.35, t2, to }) {
  const dp = easeOut(prog(t, t1, t1 + dur));
  let x;
  let y;
  if (t < t1) {
    const p = easeInOut(prog(t, t0, t1));
    x = lerp(from[0], box.x, p);
    y = lerp(from[1], box.y, p);
  } else if (!to || t < t2) {
    x = box.x + box.w * dp;
    y = box.y + box.h * dp;
  } else {
    const p = easeInOut(prog(t, t2, t2 + 0.45));
    x = lerp(box.x + box.w, to[0], p);
    y = lerp(box.y + box.h, to[1], p);
  }
  return { x, y, dp, hold: hold(t, t1, t1 + dur), visible: t >= t0 };
}

/* ---------- Medição de texto (para caixas de seleção exatas) ---------- */
const _mc = new Map();
let _cv = null;
function measure(str, size, weight = 800, ls = -0.03) {
  const key = `${weight}|${size}|${str}`;
  if (_mc.has(key)) return _mc.get(key);
  if (typeof document === "undefined") return str.length * size * 0.56;
  _cv = _cv || document.createElement("canvas");
  const ctx = _cv.getContext("2d");
  ctx.font = `${weight} ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + ls * size * str.length;
  _mc.set(key, w);
  return w;
}
function layoutLine(words, size, cx, weight = 800) {
  const gap = size * 0.24;
  const ws = words.map((w) => measure(w, size, weight));
  const total = ws.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  let x = cx - total / 2;
  return ws.map((w, i) => {
    const it = { text: words[i], x, w };
    x += w + gap;
    return it;
  });
}

/* ---------- Estilos derivados ---------- */

function popStyle(s, from = 34) {

  return {
    opacity: clamp(s * 1.8),
    transform: `translate3d(0, ${(1 - s) * from}px, 0) scale(${0.72 + 0.28 * s})`,
    filter: b > 0.3 ? `blur(${b}px)` : "none",
  };
}
const rise = (s, d = 16) => ({ opacity: clamp(s * 1.6), transform: `translateY(${(1 - s) * d}px)` });
const exitStyle = (e, { y = -24, scale = 0, blur = 8 } = {}) => ({
  opacity: 1 - e,
  transform: `translateY(${e * y}px) scale(${1 + e * scale})`,
  filter: e > 0.02 ? `blur(${e * blur}px)` : "none",
});

/* ---------- Peças compartilhadas ---------- */
function Cursor({ x, y, p = 0, r = null, opacity = 1, ringColor = C.cobalt }) {
  return (
    <div style={{ position: "absolute", left: x - 4, top: y - 2, zIndex: 60, pointerEvents: "none", opacity }}>

function SelBox({ x, y, w, h, color = C.cobalt, glow = false, opacity = 1 }) {
  const hs = 9;
  return (
    <div style={{
      position: "absolute", left: x, top: y, width: Math.max(0, w), height: Math.max(0, h), opacity,
      border: `2px solid ${color}`, background: hexA(color, 0.1), borderRadius: 3,
      boxShadow: glow ? `0 0 26px ${hexA(color, 0.55)}, inset 0 0 18px ${hexA(color, 0.25)}` : "none",
    }}>
      {[[0, 0], [1, 0], [0, 1], [1, 1]].map(([a, b], i) => (
        <div key={i} style={{
          position: "absolute", left: `calc(${a * 100}% - ${hs / 2 + 1}px)`, top: `calc(${b * 100}% - ${hs / 2 + 1}px)`,
          width: hs, height: hs, background: "#fff", border: `2px solid ${color}`, borderRadius: 2,
        }} />
      ))}
    </div>
  );
}

function Kinetic({ t, start, tokens, stagger = 0.07, size, color, weight = 800, style, lineHeight = 1.1, cfg, from = 34, justify = "center" }) {
  return (
    <div style={{
      position: "absolute", display: "flex", flexWrap: "wrap", justifyContent: justify, alignContent: "flex-start",
      columnGap: "0.24em", fontSize: size, fontWeight: weight, color, lineHeight, letterSpacing: "-0.03em", ...style,
    }}>
      {tokens.map((tk, i) => {
        const o = typeof tk === "string" ? { w: tk } : tk;
        const s = spring(t - start - i * stagger, cfg);
        return (
          <span key={i} style={{ display: "inline-block", whiteSpace: "pre", ...popStyle(s, from), ...o.style }}>{o.w}</span>
        );
      })}
    </div>
  );
}

}

function Scene1({ t }) {
  if (t > 4.4) return null;
  const F = 54;
  const PAD = 18;
  const BH = 78;
  const words = ["Loja", "Marca", "Empresa"];
  const swaps = [1.25, 2.2, 3.05];
  const ws = words.map((w) => measure(w, F));
  const qW = measure("?", F);

  let bw = ws[0];
  for (let k = 1; k < words.length; k++) bw = lerp(bw, ws[k], spring(t - swaps[k], { stiffness: 210, damping: 19 }));
  const boxW = bw + PAD * 2;
  const boxTop = 405 - BH / 2;
  const x0 = 225 - (boxW + 10 + qW) / 2;
  const drag = easeOut(prog(t, 1.0, 1.35));
  const dW = boxW * drag;
  const dH = BH * drag;
  const line1 = layoutLine(["Você", "tem", "uma"], F, 225);
  const ex = easeIn(prog(t, 3.98, 4.3));
  const after = spring(t - 1.38);

  let cx;
  let cy;
  if (t < 1.0) {
    const p = easeInOut(prog(t, 0.55, 1.0));
    cx = lerp(470, x0, p);
    cy = lerp(850, boxTop, p);
  } else if (t < 1.35) {
    cx = x0 + dW;
    cy = boxTop + dH;
  } else if (t < 3.68) {
    cx = x0 + boxW;
    cy = boxTop + BH;
  } else {
    const p = easeInOut(prog(t, 3.68, 3.98));
    cx = lerp(x0 + boxW, 300, p);
    cy = lerp(boxTop + BH, 520, p);
  }
  const p = Math.max(hold(t, 1.0, 1.35), press(t, 3.98));

  return (
    <div style={{ position: "absolute", inset: 0, ...exitStyle(ex, { y: 0, scale: 0.06, blur: 6 }) }}>
      {line1.map((it, i) => (
        <AbsWord key={i} x={it.x} y={290} size={F} s={spring(t - 0.15 - i * 0.12)} style={{ color: C.ink }}>{it.text}</AbsWord>
      ))}

      {t >= 1.0 && (
        <>
          <SelBox x={x0} y={boxTop} w={dW} h={dH} />
          <div style={{ position: "absolute", left: x0, top: boxTop, width: dW, height: dH, overflow: "hidden" }}>
            {words.map((w, k) => {
              const s = spring(t - swaps[k], { stiffness: 220, damping: 16 });
              const e = k < words.length - 1 ? easeIn(prog(t, swaps[k + 1], swaps[k + 1] + 0.22)) : 0;
              if (s <= 0 || e >= 1) return null;
              return (
                <div key={w} style={{
                  position: "absolute", left: (boxW - ws[k]) / 2, top: (BH - F) / 2 - 1, fontSize: F, fontWeight: 800,
                  letterSpacing: "-0.03em", lineHeight: 1, whiteSpace: "pre", ...gradText,
                  transform: `translateY(${(1 - s) * BH * 0.9 - e * BH * 0.9}px)`, opacity: clamp(s * 2) * (1 - e),
                }}>{w}</div>
              );
            })}
          </div>
          <AbsWord x={x0 + boxW + 10} y={boxTop + (BH - F) / 2 - 1} size={F} s={spring(t - 1.4)} style={{ color: C.ink }}>?</AbsWord>
          <div style={{
            position: "absolute", left: x0 - 1, top: boxTop - 27, ...rise(after, 8), background: C.cobalt, color: "#fff",
            fontSize: 11, fontWeight: 700, padding: "4px 9px", borderRadius: 6, letterSpacing: ".02em",
          }}>Seu negócio</div>
          <div style={{
            position: "absolute", left: x0 + boxW / 2 - 40, width: 80, top: boxTop + BH + 12, textAlign: "center", ...rise(after, -8),
            fontSize: 11, fontWeight: 700, color: C.cobalt, fontVariantNumeric: "tabular-nums",
          }}>{Math.round(boxW)} × {BH}</div>
        </>
      )}

      {t > 0.5 && <Cursor x={cx} y={cy} p={p} r={ripple(t, 3.98)} />}
    </div>
  );
}

function CardConversion({ lt }) {
  const pts = [[0, 150], [30, 142], [60, 146], [90, 128], [120, 132], [150, 108], [180, 96], [210, 70], [240, 58], [270, 30], [294, 14]];
  const line = pts.map((q, i) => `${i ? "L" : "M"}${q[0]} ${q[1]}`).join(" ");
  const area = `${line} L294 170 L0 170 Z`;
  const p = easeInOut(prog(lt, 0.15, 1.4));
  const ex = 294 * p;
  let ey = pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (ex <= pts[i][0]) {
      const a = pts[i - 1];
      const bb = pts[i];
      ey = lerp(a[1], bb[1], (ex - a[0]) / (bb[0] - a[0]));
      break;
    }
  }
  const val = Math.round(48920 * easeOut(prog(lt, 0.1, 1.3)));
  const badge = spring(lt - 1.15, { stiffness: 240, damping: 13 });
  const bars = easeOut(prog(lt, 0.6, 1.3));
  const toast = (k) => spring(lt - 0.75 - k * 0.5, { stiffness: 230, damping: 16 });
  const push = clamp(spring(lt - 1.25, { stiffness: 230, damping: 18 }));
  const pulse = (lt * 1.4) % 1;
  return (
    <div style={{ ...cardBase, background: "#fff", color: C.ink }}>

const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function EstokeAoCuboPromo() {
  const [t, setT] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [loop, setLoop] = useState(true);
  const [, setFontTick] = useState(0);
  const [scale, setScale] = useState(0.6);
  const tRef = useRef(0);
  const loopRef = useRef(loop);
  const areaRef = useRef(null);
  loopRef.current = loop;

  // Relógio mestre
  useEffect(() => {
    if (!playing) return undefined;
    let raf;
    let last = null;
    const tick = (now) => {
      if (last == null) last = now;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      let nt = tRef.current + dt;
      if (nt >= DURATION) {
        if (loopRef.current) nt -= DURATION;
        else {
          tRef.current = DURATION;
          setT(DURATION);
          setPlaying(false);
          return;
        }
      }
      tRef.current = nt;
      setT(nt);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [playing]);

  const seek = useCallback((v) => {
    tRef.current = clamp(v, 0, DURATION);
    setT(tRef.current);
  }, []);
  const restart = useCallback(() => {
    seek(0);
    setPlaying(true);
  }, [seek]);
  const toggle = useCallback(() => {
    if (tRef.current >= DURATION) seek(0);
    setPlaying((p) => !p);
  }, [seek]);

  // Reavalia medidas de texto quando a fonte carregar
  useEffect(() => {
    let alive = true;
    const fl = typeof document !== "undefined" ? document.fonts : null;
    if (fl && fl.load) {
      Promise.all([fl.load(`800 54px "Plus Jakarta Sans"`), fl.load(`600 16px "Plus Jakarta Sans"`)])
        .catch(() => {})
        .then(() => fl.ready)
        .then(() => {
          if (!alive) return;
          _mc.clear();
          setFontTick((x) => x + 1);
        });
    }
    return () => {
      alive = false;
    };
  }, []);

  // Encaixa o frame 9:16 no espaço disponível
  useEffect(() => {
    const el = areaRef.current;
    if (!el) return undefined;
    const fit = () => {
      const w = el.clientWidth - 32;
      const h = el.clientHeight - 24;
      setScale(Math.max(0.2, Math.min(w / W, h / H)));
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Atalhos: espaço = play/pause, R = reiniciar, ←/→ = ±1s
  useEffect(() => {
    const onKey = (e) => {
      if (e.target && e.target.type === "range" && e.key.startsWith("Arrow")) return;
      if (e.code === "Space") {
        e.preventDefault();
        toggle();
      } else if (e.key === "r" || e.key === "R") restart();
      else if (e.key === "ArrowRight") seek(tRef.current + 1);
      else if (e.key === "ArrowLeft") seek(tRef.current - 1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [toggle, restart, seek]);

  // Gancho para gravação/QA: window.__eac.seek(12.5)
  useEffect(() => {
    window.__eac = { seek, play: () => setPlaying(true), pause: () => setPlaying(false) };
  }, [seek]);

  const scene = [...SCENES].reverse().find((s) => t >= s.from) || SCENES[0];
  const ctrlW = Math.max(300, W * scale);

  return (
    <div style={{ width: "100%", display: "flex", flexDirection: "column", alignItems: "center", height: "100dvh", minHeight: 520, background: "#0A0B10", fontFamily: FONT, color: "#E9EBF2" }}>
      <style>{GLOBAL_CSS}</style>
      <div ref={areaRef} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", flex: "1 1 0", minHeight: 0, padding: "16px 16px 8px" }}>
        <div style={{
          width: W * scale, height: H * scale, flex: "none", position: "relative", overflow: "hidden", borderRadius: 22,
          boxShadow: "0 40px 120px -30px rgba(61,90,254,.35), 0 0 0 1px rgba(255,255,255,.07)",
        }}>
          <div style={{ width: W, height: H, transform: `scale(${scale})`, transformOrigin: "0 0", position: "relative" }}>
            <Frame t={t} />
          </div>
        </div>
      </div>

      <div style={{ width: "100%", display: "flex", justifyContent: "center", padding: "4px 16px 16px" }}>
        <div style={{ width: ctrlW, maxWidth: "100%", display: "flex", alignItems: "center", gap: 8 }}>
          <button type="button" className="eac-btn" onClick={toggle} aria-label={playing ? "Pausar" : "Reproduzir"}>
            {playing ? (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
            ) : (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" /></svg>
            )}
          </button>
          <button type="button" className="eac-btn" onClick={restart} aria-label="Reiniciar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
          </button>
          <div style={{ display: "flex", flexDirection: "column", flex: 1, minWidth: 0, gap: 4 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, letterSpacing: ".08em", textTransform: "uppercase", color: "rgba(233,235,242,.5)", fontWeight: 600 }}>
              <span>{scene.name}</span>
              <span style={{ fontVariantNumeric: "tabular-nums" }}>{fmtTime(t)} / {fmtTime(DURATION)}</span>
            </div>
            <div style={{ position: "relative", height: 12, display: "flex", alignItems: "center" }}>
              <div style={{ position: "absolute", left: 0, right: 0, height: 4, borderRadius: 4, background: "rgba(255,255,255,.1)" }} />
              <div style={{ position: "absolute", left: 0, width: `${(t / DURATION) * 100}%`, height: 4, borderRadius: 4, background: GRAD }} />
              {SCENES.slice(1).map((s) => (
                <span key={s.name} style={{ position: "absolute", left: `${(s.from / DURATION) * 100}%`, width: 2, height: 8, marginLeft: -1, borderRadius: 1, background: "rgba(255,255,255,.28)" }} />
              ))}
              <input id="eac-scrub" className="eac-range" type="range" min={0} max={DURATION} step={0.01} value={t} aria-label="Linha do tempo"
                onChange={(e) => seek(parseFloat(e.target.value))} style={{ position: "relative" }} />
            </div>
          </div>
          <button type="button" className="eac-btn" onClick={() => setLoop((l) => !l)} aria-pressed={loop} aria-label="Repetir em loop">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 2l4 4-4 4" /><path d="M3 11V9a3 3 0 0 1 3-3h15" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a3 3 0 0 1-3 3H3" /></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<EstokeAoCuboPromo />);
</script>
